    <main id="main">
      <section class="contact-hero">
        <div class="contact-image-grid">
          <img src="assets/images/contact-1.svg" alt="Work sample placeholder 1" />
          <img src="assets/images/contact-2.svg" alt="Work sample placeholder 2" />
          <img src="assets/images/contact-3.svg" alt="Work sample placeholder 3" />
          <img src="assets/images/contact-4.svg" alt="Work sample placeholder 4" />
        </div>

        <div class="container contact-intro">
          <h1>Let's work together</h1>
        </div>
      </section>

      <section class="contact-form-section">
        <div class="container">
          <form class="contact-form" novalidate>
            <div class="form-row">
              <div class="form-field">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required />
              </div>
              <div class="form-field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required />
              </div>
            </div>

            <div class="form-row">
              <div class="form-field">
                <label for="phone">Phone</label>
                <input type="tel" id="phone" name="phone" placeholder="Optional" />
              </div>
              <div class="form-field">
                <label for="project-type">Project type</label>
                <select id="project-type" name="project-type">
                  <option value="portraits">Portraits</option>
                  <option value="graduation">Graduation</option>
                  <option value="studio">Studio</option>
                  <option value="event">Event</option>
                  <option value="other">Other</option>
                </select>
              </div>
            </div>

            <div class="form-row">
              <div class="form-field">
                <label for="date">Preferred date</label>
                <input type="date" id="date" name="date" />
              </div>
              <div class="form-field" aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden;opacity:0;pointer-events:none;">
                <label for="website">Website</label>
                <input type="text" id="website" name="website" tabindex="-1" autocomplete="off" />
              </div>
            </div>

            <div class="form-field">
              <label for="message">Message</label>
              <textarea id="message" name="message" required></textarea>
            </div>

            <div class="form-field">
              <button type="submit" class="btn form-submit">Send message</button>
              <p class="form-status" aria-live="polite"></p>
            </div>
          </form>
        </div>
      </section>
    </main>
